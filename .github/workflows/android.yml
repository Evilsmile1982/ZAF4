name: Android CI

on:
  push:
    branches:
      - "hauptsächlich"
  pull_request:
    branches:
      - "hauptsächlich"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Android App bauen
        run: gradle build

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Z-Aero-Diamond-Clean
          path: app/build/outputs/apk/debug/*.apk
